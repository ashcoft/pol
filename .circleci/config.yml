version: 2.1

jobs:
  python-tests:
    docker:
      - image: cimg/python:3.15
      - image: postgres:19
        environment:
          POSTGRES_DB: pol
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    environment:
      DB_NAME: pol
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    steps:
      - checkout
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libpq-dev \
              libxml2-dev libxslt1-dev libffi-dev libssl-dev
      - run:
          name: Install Python dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt
            pip install pytest
      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              if python -c "import socket; socket.create_connection(('127.0.0.1', 5432), 2)" 2>/dev/null; then
                exit 0
              fi
              sleep 2
            done
            exit 1
      - run:
          name: Prepare database
          command: |
            . venv/bin/activate
            cp frontend/frontend/settings.py.example frontend/frontend/settings.py
            python frontend/manage.py migrate --noinput
            python frontend/manage.py loaddata fields.json
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            pytest -v tests/

workflows:
  ci:
    jobs:
      - python-tests
