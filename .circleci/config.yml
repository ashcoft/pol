version: 2.1

jobs:
  python-tests:
    docker:
      - image: cimg/python:3.15
    steps:
      - checkout
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libmysqlclient-dev \
              libxml2-dev libxslt1-dev libffi-dev libssl-dev
      - run:
          name: Install Python dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt
            pip install mysqlclient pytest
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            cp frontend/frontend/settings.py.example frontend/frontend/settings.py
            pytest -v tests/

workflows:
  ci:
    jobs:
      - python-tests
