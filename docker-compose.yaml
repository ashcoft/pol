services:
  politepol:
    image: ghcr.io/ashcoft/pol:latest
    build: .
    environment:
      DB_NAME: politepol
      DB_USER: pol
      DB_PASSWORD: politepol
      DB_HOST: db
      DB_PORT: "3306"
      WEB_PORT: "8088"
      TIME_ZONE: UTC
      # Hostname/IP you use to reach the app, e.g. 192.168.0.10
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "8088:8088"

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: politepol
      MYSQL_USER: pol
      MYSQL_PASSWORD: politepol
      MYSQL_ROOT_PASSWORD: rootpass
    restart: unless-stopped
    volumes:
      - ./mysql:/var/lib/mysql
