[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pol"
version = "1.1.0"
description = "RSS generator website"
requires-python = ">=3.12"
dependencies = [
    "lxml==6.1.3",
    "python-dateutil==4.0.0",
    "brotli==1.2.1",
]

[project.optional-dependencies]
reader = ["redis==8.1.0", "charset-normalizer==3.5.2"]

[project.scripts]
morss = "pol.reader.cli:main"
pol-feed = "pol.reader.cli:main"

[tool.setuptools.packages.find]
include = ["pol*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["pol/__init__.py:__version__"]
branch = "main"
commit_parser = "conventional"
major_on_zero = true
upload_to_release = true
upload_to_vcs_release = true

[tool.semantic_release.changelog]
exclude_commit_patterns = ["skip ci", "chore\\(release\\):"]

[tool.semantic_release.remote]
type = "github"
