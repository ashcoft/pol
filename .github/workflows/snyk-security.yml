# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-partyand are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source,Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
#The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
#The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.

name: Snyk Security

on:
  push:
    branches: ["master" ]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  snyk-token:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check for Snyk token
        id: check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Snyk scan skipped::SNYK_TOKEN is not configured; Snyk security scans were skipped. Configure SNYK_TOKEN in repository secrets to enable Snyk scanning."
            echo "::notice title=Snyk scan skipped::SNYK_TOKEN is not configured; Snyk security scans were skipped."
          fi

  snyk:
    needs: snyk-token
    # The Snyk CLI requires a Snyk API token. When none is configured the
    # whole job is skipped (shown as "skipped", not "success") so a green
    # result never implies a completed security scan. When a token is added
    # later, the job runs automatically against it.
    if: needs.snyk-token.outputs.has_token == 'true'
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Snyk CLI to check for security issues
        # Snyk can be used to break the build when it detects security issues.

        # In this case we want to upload the SAST issues to GitHub Code Scanning
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb


        # For Snyk Open Source you must first set up the development environment for your application's dependencies
        # For example for Node
        #- uses: actions/setup-node@v4
        #  with:
        #    node-version: 20


        # Runs Snyk Code (SAST) analysis and uploads result into GitHub.
        # Use || true to not fail the pipeline
      - name: Snyk Code test
        run: snyk code test --sarif > snyk-code.sarif # || true


        # Runs Snyk Open Source (SCA) analysisand uploads result to Snyk.
      - name: Snyk Open Source monitor
        run: snyk monitor --all-projects


        # Runs Snyk Infrastructure as Code (IaC) analysisand uploads result to Snyk.
        # Use || true to not fail the pipeline.

      - name: Snyk IaC test and report
        run: snyk iac test --report # || true


        # Build the docker image for testing (only needed for Snyk Container scan)
      - name: Build a Docker image
        run: docker build -t your/image-to-test .
        # Runs Snyk Container (Containerand SCA) analysisand uploads result to Snyk.


      - name: Snyk Container monitor
        run: snyk container monitor your/image-to-test --file=Dockerfile


        # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
