name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (mysqlclient build)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev libxml2-dev libxslt1-dev libffi-dev libssl-dev

      - name: Install Python deps
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install mysqlclient pytest

      - name: Generate settings module (repo expects settings.py from example)
        run: cp frontend/frontend/settings.py.example frontend/frontend/settings.py

      - name: Run tests
        run: pytest -v tests/

  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    continue-on-error: true # legacy codebase: surface issues without blocking merges
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate settings module
        run: cp frontend/frontend/settings.py.example frontend/frontend/settings.py

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt mysqlclient pylint

      - name: Pylint (errors only)
        run: |
          pylint --errors-only pol/ frontend/frontend/setup_tool_ext.py tests/test_ci.py || true

      - name: Node syntax check on vendored JS
        run: |
          node --check frontend/frontend/assets/frontend/js/jquery.js
          node --check frontend/frontend/assets/frontend/js/bootstrap.js

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pol:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify app imports inside image
        run: |
          docker run --rm pol:ci python -c "import pol.server; import frontend.frontend.setup_tool_ext; print('APP IMPORTS OK')"