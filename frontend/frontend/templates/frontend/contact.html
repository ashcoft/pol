{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="page-header">
  <h1>{% trans "contact" %}</h1>
</div>
<div class="media">
  {% if contact_url %}
  <p>
    {% trans "contact.title" %}
    <a class="btn btn-link" id="contact_link" href="{{ contact_url }}" target="_blank" rel="noopener">{{ contact_url }}</a>
  </p>
  <p class="help-inline">{% trans "contact.msg" %}</p>
  {% else %}
  <p>{% trans "contact.none" %}</p>
  {% endif %}
</div>
{% endblock %}
