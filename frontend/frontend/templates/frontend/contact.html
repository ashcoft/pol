{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block content %}
<div class="page-header">
  <h1>{% trans "contact" %}</h1>
</div>
<div class="media">
<form class="form-horizontal">
 <div class="control-group">
   <label class="control-label" for="github_link">{% trans "contact.title" %}</label>
   <div class="controls">
     <div class="input-prepend">
       <span class="add-on"><i class="icon-globe"></i></span>
       <a class="btn btn-link" id="github_link" href="https://github.com/ashcoft/" target="_blank" rel="noopener">github.com/ashcoft</a>
     </div>
     <span class="help-inline">{% trans "contact.msg" %}</span>
   </div>
 </div>
</form>
</div>
{% endblock %}
